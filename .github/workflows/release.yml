name: Check and release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hyper-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check extension
        run: npm run check

      - name: Build extension
        env:
          HYPER_EXTENSION_VERSION: 0.1.${{ github.run_number }}.${{ github.run_attempt }}
        working-directory: extensions/hyper
        run: npm run zip

      - name: Build website
        run: npm run build:site

      - name: Upload extension package
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: hyper-extension-${{ github.run_number }}-${{ github.run_attempt }}
          path: extensions/hyper/output/hyper-sidebar-*-chrome.zip
          if-no-files-found: error
          retention-days: 30

  publish-extension:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Download extension package
        uses: actions/download-artifact@v4
        with:
          name: hyper-extension-${{ github.run_number }}-${{ github.run_attempt }}
          path: extensions/hyper/output

      - name: Publish extension
        working-directory: extensions/hyper
        env:
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          zip_file=$(find output -maxdepth 1 -name 'hyper-sidebar-*-chrome.zip' -print -quit)
          test -n "$zip_file"

          published=0

          if [[ -n "$CHROME_EXTENSION_ID$CHROME_PUBLISHER_ID$CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL$CHROME_SERVICE_ACCOUNT_PRIVATE_KEY" ]]; then
            if [[ -z "$CHROME_EXTENSION_ID" || -z "$CHROME_PUBLISHER_ID" || -z "$CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL" || -z "$CHROME_SERVICE_ACCOUNT_PRIVATE_KEY" ]]; then
              echo "Chrome publishing is partially configured." >&2
              exit 1
            fi
            npx --no-install wxt submit \
              --chrome-api-version v2 \
              --chrome-extension-id "$CHROME_EXTENSION_ID" \
              --chrome-publisher-id "$CHROME_PUBLISHER_ID" \
              --chrome-service-account-client-email "$CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL" \
              --chrome-service-account-private-key "$CHROME_SERVICE_ACCOUNT_PRIVATE_KEY" \
              --chrome-zip "$zip_file"
            published=1
          fi

          if [[ -n "$EDGE_CLIENT_ID$EDGE_API_KEY$EDGE_PRODUCT_ID" ]]; then
            if [[ -z "$EDGE_CLIENT_ID" || -z "$EDGE_API_KEY" || -z "$EDGE_PRODUCT_ID" ]]; then
              echo "Edge publishing is partially configured." >&2
              exit 1
            fi
            npx --no-install wxt submit \
              --edge-client-id "$EDGE_CLIENT_ID" \
              --edge-api-key "$EDGE_API_KEY" \
              --edge-product-id "$EDGE_PRODUCT_ID" \
              --edge-zip "$zip_file"
            published=1
          fi

          if [[ "$published" -ne 1 ]]; then
            echo "No browser-store publishing credentials are configured; retaining the verified artifact without submission."
            exit 0
          fi

  deploy-site:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RENDER_DEPLOY_HOOK_URL" ]]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured." >&2
            exit 1
          fi
          separator='?'
          [[ "$RENDER_DEPLOY_HOOK_URL" == *\?* ]] && separator='&'
          curl --fail-with-body --retry 3 --retry-all-errors \
            --request POST \
            "${RENDER_DEPLOY_HOOK_URL}${separator}ref=${GITHUB_SHA}"
